variables:
  BRANCH_NAME: $[ replace(variables['System.PullRequest.SourceBranch'], 'refs/heads/', '') ]
  GRADLE_USER_HOME: $(Pipeline.Workspace)/.gradle
trigger:
 branches:
  include:
    - main

pool:
  vmImage: ubuntu-latest

stages:
  - stage: BuildEndUnitTest
    jobs:
      - job: make_buildEndUnitTest
        steps:
          - task: Cache@2
            inputs:
              key: 'gradle | "$(Agent.OS)" | **/build.gradle.kts' # Swap build.gradle.kts for build.gradle when using Groovy
              restoreKeys: |
                gradle | "$(Agent.OS)"
                gradle
              path: $(GRADLE_USER_HOME)
            displayName: Configure gradle caching

          - task: SonarCloudPrepare@3
            displayName: 'Prepare SonarCloud analysis configuration'
            inputs:
              SonarCloud: '$(SONARCLOUD_SERVICE_CONN)'
              organization: '$(SONARCLOUD_ORG)'
              scannerMode: Other
              extraProperties: |
                sonar.projectKey=$(SONARCLOUD_PROJECT_KEY)
                sonar.projectName=$(SONARCLOUD_PROJECT_NAME)
                sonar.coverage.exclusions=**/config/*,**/*Mock*,**/model/*
                sonar.coverage.jacoco.xmlReportPaths=./build/reports/jacoco/test/jacocoTestReport.xml
                sonar.junit.reportPaths=./build/test-results/test

          - task: Gradle@3
            inputs:
              gradleWrapperFile: 'gradlew' # string. Alias: wrapperScript. Required. Gradle wrapper. Default: gradlew.
              tasks: 'build -PbuildCommons' # string. Required. Tasks. Default: build.
              publishJUnitResults: true
              testResultsFiles: '**/TEST-*.xml' # string. Required when publishJUnitResults = true. Test results files. Default: **/TEST-*.xml.
              codeCoverageToolOption: 'None' # 'None' | 'Cobertura' | 'JaCoCo'. Alias: codeCoverageTool. Code coverage tool. Default: None.
              codeCoverageClassFilesDirectories: 'build/classes/main/' # string. Alias: classFilesDirectories. Required when codeCoverageTool != None. Class files directories. Default: build/classes/main/.
              javaHomeOption: 'JDKVersion' # 'JDKVersion' | 'Path'. Alias: javaHomeSelection. Required. Set JAVA_HOME by. Default: JDKVersion.
              jdkVersionOption: '1.21' # Alias: jdkVersion. Optional. Use when javaHomeSelection = JDKVersion. JDK version. Default: default.
              sonarQubeRunAnalysis: true

          - task: SonarCloudPublish@3
            displayName: 'Publish SonarCloud results on build summary'
            inputs:
              pollingTimeoutSec: '300'
          - script: |
              # stop the Gradle daemon to ensure no files are left open (impacting the save cache operation later)
              ./gradlew --stop
            displayName: Gradlew stop

          - task: PublishCodeCoverageResults@2
            inputs:
              codeCoverageTool: 'JaCoCo'
              summaryFileLocation: 'build/reports/jacoco/test/jacocoTestReport.xml'
              reportDirectory: 'build/reports/jacoco/test/html'
            displayName: 'Publish Code Coverage on Azure Devops'

  - stage: IntegrationTest
    dependsOn: [ ]
    jobs:
      - job: make_integration_test
        steps:
            - script: cp .env.example .env
              displayName: 'Setup env'

            - script: docker compose up -d
              displayName: 'Run app with docker-compose'

            - script: |
                echo "Waiting the start of the service..."
                
                for i in {1..15}; do
                  STATUS=$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/actuator/health/liveness)
                  if [ "$STATUS" == "200" ]; then
                    echo "Service UP!"
                    exit 0
                  fi
                    echo "Try number $i: Received $STATUS. Waiting..."
                  sleep 5
                done
                
                echo "Healthcheck failed. Container's log:"
                docker logs pagopa-ecommerce-watchdog-deadletter-service
                exit 1
              displayName: 'Health check'

            - script: |
                BASE_URL="localhost:8080/v2/internal/deadletter-transactions"
                QUERY="fromDate=2025-10-28&toDate=2025-10-28&pageNumber=0&pageSize=10"
                API_KEY="local-internal-api-key"

                fail() {
                  echo "$1"
                  docker logs pagopa-ecommerce-watchdog-deadletter-service
                  exit 1
                }

                echo "Without api key -> 401"
                STATUS=$(curl -s -o /dev/null -w '%{http_code}' "$BASE_URL?$QUERY")
                [ "$STATUS" == "401" ] || fail "Expected 401 without api key, got $STATUS"

                echo "Wrong api key -> 401"
                STATUS=$(curl -s -o /dev/null -w '%{http_code}' -H "x-api-key: wrong" "$BASE_URL?$QUERY")
                [ "$STATUS" == "401" ] || fail "Expected 401 with wrong api key, got $STATUS"

                echo "Invalid pageSize with valid api key -> 400"
                STATUS=$(curl -s -o /dev/null -w '%{http_code}' -H "x-api-key: $API_KEY" "$BASE_URL?fromDate=2025-10-28&toDate=2025-10-28&pageNumber=0&pageSize=0")
                [ "$STATUS" == "400" ] || fail "Expected 400 with pageSize=0, got $STATUS"

                echo "Valid api key -> 200 with transactions and actions"
                STATUS=$(curl -s -o response.json -w '%{http_code}' -H "x-api-key: $API_KEY" "$BASE_URL?$QUERY")
                cat response.json; echo
                [ "$STATUS" == "200" ] || fail "Expected 200 with valid api key, got $STATUS"
                jq -e '.deadletterTransactions | length == 1' response.json || fail "Expected exactly one transaction"
                jq -e '.deadletterTransactions[0].transactionId == "f6b85ca9fd8c4b58b2c02a7de7918a3d"' response.json || fail "Unexpected transactionId"
                jq -e '.deadletterTransactions[0].actions | length >= 1' response.json || fail "Expected at least one action on the transaction"
                jq -e '.deadletterTransactions[0].actions[0].transactionId == "f6b85ca9fd8c4b58b2c02a7de7918a3d"' response.json || fail "Action not bound to the transaction"
                jq -e '.page.results == 1' response.json || fail "Unexpected page info"
              displayName: 'Internal API test (deadletter-transactions with actions)'