openapi: 3.0.0
info:
  version: 1.0.0
  title: PagoPA Ecommerce Watchdog Service API
  description: API service to monitor deadletter transactions and manually track recovery or follow-up actions.
servers:
  - url: https://${host}
tags:
  - name: deadletter-transactions
    description: Deadletter transaction management
  - name: deadletter-transactions-actions
    description: Manual actions or notes related to deadletter transactions
  - name: authentication
    description: User authentication
  - name: internal
    description: Internal APIs authenticated with an api key
paths:
  /v2/deadletter-transactions:
    get:
      tags:
        - deadletter-transactions
      summary: List all deadletter transactions
      operationId: listDeadletterTransactions
      security:
        - bearerAuth: []
      parameters:
        - name: fromDate
          in: query
          required: true
          schema:
            type: string
            format: date
            example: '2025-08-19'
          description: Filter transactions by a starting date (format YYYY-MM-DD)
        - name: toDate
          in: query
          required: true
          schema:
            type: string
            format: date
            example: '2025-08-19'
          description: Filter transactions by a ending date (format YYYY-MM-DD)
        - name: pageNumber
          in: query
          required: true
          schema:
            type: integer
            default: 0
            minimum: 0
          description: Searched page number, starting from 0
        - name: pageSize
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 10
          description: Max element per page
      responses:
        '200':
          description: List of deadletter transactions with pagination
          content:
            application/json:
              schema:
                type: object
                properties:
                  deadletterTransactions:
                    type: array
                    items:
                      $ref: '#/components/schemas/DeadletterTransaction'
                  page:
                    $ref: '#/components/schemas/PageInfo'
                required:
                  - deadletterTransactions
                  - page
        '400':
          description: Invalid request or query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
        '401':
          description: Unauthorized. Missing or invalid authentication token.
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
  /v2/deadletter-transactions/actions:
    post:
      description: >
        [GET with body payload](https://opensource.zalando.com/restful-api-guidelines/#get-with-body)
        - no resources created: Returns all actions matching the transactionIds passed as request input payload.
      tags:
        - deadletter-transactions-actions
      summary: List actions for a list of deadletter transaction
      operationId: listActionsForDeadletterTransaction
      security:
        - bearerAuth: []
      requestBody:
        description: TransactionIds actions to retrieve
        required: true
        content:
          application/json:
            schema:
                $ref: '#/components/schemas/DeadletterTransactionActionsRequest'
      responses:
        '200':
          description: List of actions taken on the list of deadletter transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/DeadletterTransactionAction'
        '400':
          description: Invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
        '401':
          description: Unauthorized. Missing or invalid authentication token.
        '404':
          description: Deadletter transaction not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
  /v2/internal/deadletter-transactions:
    get:
      description: >
        Internal API authenticated with an api key (x-api-key header), intended to be invoked by APIM only. Every transaction is returned together with the actions taken on it.
      tags:
        - internal
      summary: List all deadletter transactions with their actions
      operationId: listDeadletterTransactionsInternal
      security:
        - apiKeyAuth: []
      parameters:
        - name: fromDate
          in: query
          required: true
          schema:
            type: string
            format: date
            example: '2025-08-19'
          description: Filter transactions by a starting date (format YYYY-MM-DD)
        - name: toDate
          in: query
          required: true
          schema:
            type: string
            format: date
            example: '2025-08-19'
          description: Filter transactions by a ending date (format YYYY-MM-DD)
        - name: pageNumber
          in: query
          required: true
          schema:
            type: integer
            default: 0
            minimum: 0
          description: Searched page number, starting from 0
        - name: pageSize
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 10
          description: Max element per page
      responses:
        '200':
          description: List of deadletter transactions with pagination, each one with the actions taken on it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeadletterTransactionsWithActionsResponse'
        '400':
          description: Invalid request or query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
        '401':
          description: Unauthorized. Missing or invalid api key.
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemJson'
components:
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    PageInfo:
      description: Information about the returned query page
      type: object
      properties:
        current:
          type: integer
          description: Current returned page index (0-based)
        total:
          type: integer
          description: Total pages for the query (based on requested page size)
        results:
          type: integer
          description: Transactions returned into the current page
      required:
        - current
        - results
        - total
    DeadletterTransaction:
      type: object
      properties:
        transactionId:
          type: string
        insertionDate:
          type: string
          format: date-time
        paymentToken:
          type: string
        paymentMethodName:
          type: string
        pspId:
          type: string
        eCommerceStatus:
          type: string
        gatewayAuthorizationStatus:
          type: string
        nodoStatus:
          type: string
        paymentEndToEndId:
          type: string
        operationId:
          type: string
        deadletterTransactionDetails:
          type: object
        eCommerceDetails:
          type: object
        nodoDetails:
          type: object
        npgDetails:
          type: object
      required:
        - id
        - insertionDate
        - transactionId
        - paymentToken
        - paymentMethodName
        - pspId
        - eCommerceStatus
        - deadletterTransactionDetails
    DeadletterTransactionsWithActionsResponse:
      type: object
      properties:
        deadletterTransactions:
          type: array
          items:
            $ref: '#/components/schemas/DeadletterTransactionWithActions'
        page:
          $ref: '#/components/schemas/PageInfo'
      required:
        - deadletterTransactions
        - page
    DeadletterTransactionWithActions:
      allOf:
        - $ref: '#/components/schemas/DeadletterTransaction'
        - type: object
          properties:
            actions:
              type: array
              description: Actions taken on the deadletter transaction, sorted by timestamp
              items:
                $ref: '#/components/schemas/DeadletterTransactionAction'
          required:
            - actions
    DeadletterTransactionAction:
      type: object
      properties:
        id:
          type: string
        transactionId:
          type: string
        userId:
          type: string
        action:
          $ref: '#/components/schemas/ActionType'
        timestamp:
          type: string
          format: date-time
      required:
        - id
        - transactionId
        - userId
        - action
        - timestamp
    DeadletterTransactionActionsRequest:
      type: object
      properties:
        transactionIds:
          type: array
          minItems: 1
          items:
            type: string
      required:
        - transactionIds
    ActionType:
      type: object
      properties:
        value:
          type: string
        type:
          type: string
          enum:
            - "FINAL"
            - "NOT_FINAL"
      required:
        - value
        - type
    ProblemJson:
      type: object
      properties:
        type:
          type: string
          format: uri
          example: https://example.com/problem/invalid-request
        title:
          type: string
          example: Invalid Request
        status:
          type: integer
          example: 400
        detail:
          type: string
          example: The provided input is not valid
        instance:
          type: string
          format: uri
          example: /deadletter-transactions/123/actions